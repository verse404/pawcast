<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="PawCast — Live pavement heat, Extreme UV (11+), rain, and off-leash dog beach & park planner across Melbourne (799), Sydney (1,161), and Shanghai (222) suburbs."
    />
    <meta name="theme-color" content="#166345" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PawCast" />
    <meta property="og:title" content="PawCast — Smart Dog Walk Planner" />
    <meta
      property="og:description"
      content="Check live paw-safe pavement heat, Extreme UV, and 2,182 official Melbourne, Sydney & Shanghai suburbs with real park photos and exact dog-gate directions."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./icon-512.png" />
    <title>PawCast — Smart Dog Walk Planner</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@14..36,400..800,0..100&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #e7e5dd;
        font-family: 'Google Sans Flex', 'Noto Sans SC', -apple-system,
          BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-variant-ligatures: no-contextual;
        font-feature-settings: 'calt' 0, 'liga' 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        overflow: hidden;
        margin: 0;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      *:focus-visible {
        outline: 2px solid #166345;
        outline-offset: 2px;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(22, 99, 69, 0.22);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(22, 99, 69, 0.38);
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run PawCast.</noscript>
    <div id="root"></div>
  </body>
</html>
